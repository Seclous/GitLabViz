name: Validate branches and pull requests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm run test:bundle
      - run: xvfb-run -a npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-html
          path: |
            dist/index.html
            dist/SHA256SUMS
